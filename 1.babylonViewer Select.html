Mixamo select
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabylonJS Viewer - Select</title>
    <script src="https://cdn.babylonjs.com/viewer/babylon.viewer.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .viewerContainer { width: 100%; height: 500px; margin-top: 20px; }
    </style>
    <script>
        function loadModel(modelUrl) {
            if(modelUrl) {
                let viewer = BabylonViewer.viewerManager.getViewerById('viewerID');
                viewer.loadModel(modelUrl);
            }
        }
    </script>
</head>
<body>
    <h3>切換模型展示：</h3>
    <select onchange="loadModel(this.value)">
        <option value="">請選擇模型</option>
        <option value="./model/mixamo_hw_2.glb">模型二 (HW 2)</option>
        <option value="./model/mixamo_hw_3.glb">模型三 (HW 3)</option>
    </select>

    <div class="viewerContainer">
        <babylon id="viewerID" extends="minimal"></babylon>
    </div>
</body>
</html>
</html>
