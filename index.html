Welcome to my model show!
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my model show!</title>
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 展示卡片容器 */
        .showcase-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #2d3436;
            font-size: 24px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 25px 0;
        }

        /* 連結清單樣式 */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 20px; /* 這裡控制了文字與按鈕之間的間距 */
        }

        /* 讓連結看起來像精緻的按鈕 */
        .model-link {
            text-decoration: none;
            color: #555;
            font-size: 16px;
            padding: 12px 20px;
            border: 1px solid #dfe6e9;
            border-radius: 12px;
            background: #fff;
            transition: all 0.3s ease;
            display: block;
        }

        /* 滑鼠移上去的效果 */
        .model-link:hover {
            background-color: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        /* 底部註解文字 */
        .footer-note {
            font-size: 12px;
            color: #b2bec3;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="showcase-card">
    <h1>✨ Welcome to my model show! ✨</h1>
    
    <div class="link-list">
        <a href="sketchfab.html" class="model-link">SketchFab Model</a>
        
        <a href="0.babylonViewer Basic.html" class="model-link">Mixamo Model</a>
        
        <a href="1.babylonViewer Select.html" class="model-link">Mixamo Models Select</a>
        
        <a href="2.babylonViewer Navbar.html" class="model-link">Mixamo Models Navbar</a>
    </div>

    <hr/>
    <div class="footer-note">
        Powered by BabylonJS & GitHub Pages
    </div>
</div>

</body>
</html>
